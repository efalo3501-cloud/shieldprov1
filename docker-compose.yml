version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shield-pro-app
    container_name: shield-pro-container
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:zZlXoI6R5eTj80q8uT7VbE4h9fJ6wG3d5Y9a8B7c6D0=
